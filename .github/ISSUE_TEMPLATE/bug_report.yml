name: Casefile bug report
description: Report a Useproof casefile, verdict, or receipt issue.
labels: ["bug", "needs-triage"]
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Useproof issue. Please focus on the casefile, expected verdict, and actual receipts.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Use `git rev-parse --short HEAD` or the package version.
      placeholder: "e.g. 0.1.0 or 3eec3db"
    validations:
      required: true
  - type: textarea
    id: casefile
    attributes:
      label: Casefile or task
      description: Paste the casefile YAML or the natural-language task.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected verdict
      description: What should the run prove, capture, or save?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead? Include tape, screenshots, receipts, or dossier paths if possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, browser mode, model provider"
    validations:
      required: false
