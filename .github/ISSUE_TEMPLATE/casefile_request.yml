name: Casefile request
description: Propose a casefile Useproof should be able to run.
labels: ["casefile", "product"]
title: "Casefile: "
body:
  - type: input
    id: case_name
    attributes:
      label: Case name
      placeholder: "checkout-smoke-test"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Objective
      description: What real user journey should this casefile prove?
    validations:
      required: true
  - type: textarea
    id: verdict_rules
    attributes:
      label: Verdict rules
      description: What should be true at the end?
      placeholder: |
        - page contains "Order confirmed"
        - final URL contains "/orders/"
        - confirmation number is captured
    validations:
      required: true
  - type: textarea
    id: receipts
    attributes:
      label: Needed receipts
      description: What evidence would make the verdict trustworthy?
      placeholder: "screenshot, browser trace, run tape, dossier"
    validations:
      required: false
