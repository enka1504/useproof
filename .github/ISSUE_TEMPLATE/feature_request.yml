name: Feature request
description: Suggest a Useproof product capability.
labels: ["enhancement", "needs-triage"]
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What casefile, verdict, receipt, tape, or dossier problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Useproof do?
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Evidence output
      description: What receipts or dossier sections should the feature produce or improve?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Casefile spec
        - Recorder
        - Verdicts
        - Receipts
        - Dossiers
        - CI
        - Monitoring
        - Documentation
    validations:
      required: true
