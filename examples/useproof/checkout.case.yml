case: checkout-smoke-test
objective: Prove that the demo checkout reaches an order confirmation page.

agent:
  task: >
    Open the demo store, add the sample product to cart, complete checkout with
    the test card, and stop on the order confirmation page.
  model: auto
  max_steps: 25

browser:
  headless: true
  viewport:
    width: 1440
    height: 1100

verdict:
  pass_when:
    - page_contains: Order confirmed
    - url_matches: /orders/
    - capture: confirmation_number

receipts:
  - screenshot
  - run_tape
  - browser_trace
  - dossier

retry:
  attempts: 1
  on:
    - navigation_timeout
    - model_rate_limit
