  <path d="M78 132H178L206 92L252 174L292 118L336 152H426" stroke="#34D399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="238" fill="#FFF7E6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="700">Useproof</text>
  <text x="80" y="286" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25">THE FLIGHT RECORDER FOR BROWSER AGENTS</text>
